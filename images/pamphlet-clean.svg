<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">On-Deck Alliance pamphlet mockup</title>
  <desc id="desc">A clean flyer-style paper sheet with cool-toned accents and no outer background.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7d6e6"/>
      <stop offset="100%" stop-color="#8aa0b8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00111f" flood-opacity="0.20"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="72" y="56" width="756" height="1090" rx="34" fill="url(#paper)"/>
    <rect x="72" y="56" width="756" height="1090" rx="34" fill="none" stroke="url(#border)" stroke-width="8"/>
    <rect x="110" y="96" width="680" height="1006" rx="24" fill="none" stroke="#dbe6f0" stroke-width="2"/>
  </g>

  <rect x="132" y="140" width="636" height="92" rx="18" fill="#e8f0f8"/>
  <rect x="132" y="140" width="300" height="92" rx="18" fill="#3e78c4" opacity="0.14"/>
  <rect x="132" y="140" width="636" height="10" rx="5" fill="#2c6db5" opacity="0.45"/>

  <rect x="138" y="272" width="624" height="14" rx="7" fill="#d6e1eb"/>
  <rect x="138" y="326" width="476" height="14" rx="7" fill="#d6e1eb"/>
  <rect x="138" y="380" width="542" height="14" rx="7" fill="#d6e1eb"/>
  <rect x="138" y="434" width="402" height="14" rx="7" fill="#d6e1eb"/>

  <rect x="138" y="524" width="624" height="184" rx="24" fill="#f7fbff" stroke="#cedbeb"/>
  <rect x="174" y="560" width="130" height="16" rx="8" fill="#2d67b0" opacity="0.95"/>
  <rect x="174" y="596" width="296" height="18" rx="9" fill="#d6e1eb"/>
  <rect x="174" y="632" width="442" height="18" rx="9" fill="#d6e1eb"/>
  <rect x="174" y="668" width="376" height="18" rx="9" fill="#d6e1eb"/>

  <rect x="138" y="764" width="624" height="244" rx="24" fill="#edf5fb" stroke="#cedbeb"/>
  <rect x="174" y="800" width="170" height="18" rx="9" fill="#1d4f8d"/>
  <rect x="174" y="840" width="520" height="16" rx="8" fill="#d6e1eb"/>
  <rect x="174" y="876" width="468" height="16" rx="8" fill="#d6e1eb"/>
  <rect x="174" y="912" width="392" height="16" rx="8" fill="#d6e1eb"/>
  <rect x="174" y="948" width="300" height="16" rx="8" fill="#d6e1eb"/>

  <rect x="138" y="1050" width="624" height="50" rx="18" fill="#dfeaf4"/>
</svg>
